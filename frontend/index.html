<body>
    <div class="d-flex flex-column min-vh-100">
        
        <nav class="navbar navbar-expand bg-body-tertiary border-bottom px-3">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-3 m-0" href="#">
                    <span class="letra-y">Y</span><span class="letra-2">2</span><span class="letra-k">K</span>
                    Market
                </a>
                
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                        <input class="form-check-input" type="checkbox" id="darkmode-toggle" style="cursor: pointer;">
                        <label class="form-check-label text-secondary" for="darkmode-toggle">
                            <i class="bi bi-moon-stars-fill"></i>
                        </label>
                    </div>
                    <a href="../screens/iniciarSesion.html" class="text-secondary fs-4" title="Admin Login">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </div>
            </div>
        </nav>

        <main class="hero-section d-flex align-items-center justify-content-center flex-grow-1">
            <div class="container px-4">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-6 col-lg-5">
                        
                        <div class="card card-bienvenida shadow-lg border-0 rounded-4 p-4">
                            <div class="card-body text-center">
                                <h1 class="fw-bold mb-2 fs-2">¡Bienvenido!</h1>
                                <p class="text-muted mb-4">Tu tienda de tecnología favorita.</p>
                                
                                <form action="#" class="form-nombre">
                                    <div class="mb-3 text-start">
                                        <label for="nombre" class="form-label fw-semibold text-secondary">Ingresá tu nombre para comenzar:</label>
                                        <input type="text" id="nombre" class="form-control form-control-lg" placeholder="Ej. Lucila" required />
                                        <div id="mensaje-error" class="invalid-feedback d-none mt-2"></div>
                                        <div id="saludo" class="valid-feedback d-none mt-2"></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold shadow-sm">
                                        Ingresar
                                    </button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
