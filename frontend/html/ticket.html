<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Market - Ticket</title>

    <link rel="icon" href="../img/L.I.Store.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&family=Prompt:wght@600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/ticket.css">
</head>
<body>
<div class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand bg-body-tertiary border-bottom px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">
                <span class="letra-y">Y</span><span class="letra-2">2</span><span class="letra-k">K</span>
                Market
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="form-check form-switch d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" id="darkmode-toggle">
                    <label class="form-check-label" for="darkmode-toggle">
                        <i class="bi bi-moon-stars-fill"></i>
                    </label>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <div class="ticket-wrapper" id="ticket-pdf">

                        <div class="ticket-header text-center">
                            <h1 class="ticket-marca mb-0">
                                <span class="letra-y">Y</span><span class="letra-2">2</span><span class="letra-k">K</span>
                                Market
                            </h1>
                            <p class="ticket-subtitulo mb-0">Comprobante de compra</p>
                            <hr class="ticket-divisor">
                            <div class="d-flex justify-content-between ticket-meta">
                                <span><i class="bi bi-person me-1"></i><span id="ticket-usuario"></span></span>
                                <span><i class="bi bi-calendar me-1"></i><span id="ticket-fecha"></span></span>
                            </div>
                        </div>

                        <!-- Productos -->
                        <div class="ticket-body">
                            <h6 class="ticket-seccion-titulo">Detalle de productos</h6>
                            <div id="ticket-productos"></div>
                        </div>

                        <div class="ticket-footer">
                            <hr class="ticket-divisor">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="ticket-total-label">TOTAL</span>
                                <span class="ticket-total-precio" id="ticket-total"></span>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex gap-3 mt-4 justify-content-center no-print">
                        <button class="btn btn-outline-secondary" onclick="descargarPDF()">
                            <i class="bi bi-download me-2"></i>Descargar PDF
                        </button>
                        <button class="btn btn-primary" onclick="salir()">
                            <i class="bi bi-house me-2"></i>Salir
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../js/cambiarTema.js"></script>
<script src="../js/ticket.js"></script>
</body>
</html>
