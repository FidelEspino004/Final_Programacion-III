<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Market - Detalle</title>

    <link rel="icon" href="../img/L.I.Store.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&family=Prompt:wght@600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/detalle.css">
</head>
<body>
<div class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">
                <span class="letra-y">Y</span><span class="letra-2">2</span><span class="letra-k">K</span>
                Market
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="form-check form-switch d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" id="darkmode-toggle">
                    <label class="form-check-label" for="darkmode-toggle">
                        <i class="bi bi-moon-stars-fill"></i>
                    </label>
                </div>
                <a href="productos.html" class="text-body-secondary fs-4" title="Volver">
                    <i class="bi bi-arrow-left-circle"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="detalle-main flex-grow-1">
        <!-- MITAD IZQUIERDA — Imagen -->
        <div class="detalle-lado detalle-lado-imagen">
            <div class="detalle-imagen-wrapper">
                <img id="detalle-imagen" src="" alt="" class="detalle-imagen">
                <div id="detalle-imagen-placeholder" class="detalle-imagen-placeholder d-none">
                    <i class="bi bi-image"></i>
                </div>
            </div>
        </div>

        <!-- MITAD DERECHA — Info -->
        <div class="detalle-lado detalle-lado-info">
            <span id="detalle-tipo" class="detalle-tipo"></span>
            <h1 id="detalle-nombre" class="detalle-nombre"></h1>
            <p id="detalle-precio" class="detalle-precio"></p>
            <button class="detalle-btn-carrito" onclick="agregarDesdeDetalle()">
                <i class="bi bi-cart-plus me-2"></i>
                Agregar al carrito
            </button>
        </div>
    </main>

</div>

<script src="../js/cambiarTema.js"></script>
<script src="../js/carrito.js"></script>
<script src="../js/detalle.js"></script>
</body>
</html>
