<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Market - Carrito</title>

    <link rel="icon" href="../img/" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&family=Prompt:wght@600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/carrito.css">

</head>

<body>

<div class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold fs-3" href="../index.html">
                <span class="letra-y">Y</span><span class="letra-2">2</span><span class="letra-k">K</span>
                Market
            </a>

            <div class="d-flex align-items-center gap-3 ms-auto">

                <span id="saludo-usuario" class="text-body-secondary small"></span>

                <div class="form-check form-switch d-flex align-items-center gap-2">

                    <input class="form-check-input" type="checkbox" id="darkmode-toggle">
                    <label class="form-check-label" for="darkmode-toggle">
                        <i class="bi bi-moon-stars-fill"></i>
                    </label>

                </div>

                <a href="productos.html" class="text-body-secondary fs-4" title="Volver">
                    <i class="bi bi-arrow-left-circle"></i>
                </a>

            </div>

        </div>
    </nav>

    <main class="container-fluid py-4 flex-grow-1">
        <div class="row g-4">

            <section class="col-12 col-lg-9">

                <h2 class="mb-4"><i class="bi bi-cart-fill me-2"></i>Mi carrito</h2>

                <div id="contenedorCarrito" class="d-flex flex-column gap-3"></div>

            </section>

            <aside class="col-12 col-lg-3">
                <div class="card shadow-sm sticky-top resumen-carrito">

                    <div class="card-body">
                        <h3 class="text-center mb-4">Resumen</h3>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Productos</span>
                            <div id="cantidadProductos"></div>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Total</span>
                            <span id="precioTotal" class="fw-bold fs-4">$0</span>
                        </div>

                        <hr>

                        <button id="btn-finalizar" class="btn btn-primary w-100">
                            <i class="bi bi-credit-card me-2"></i>
                            Finalizar compra
                        </button>
                    </div>

                </div>
            </aside>

        </div>

    </main>
</div>

<script src="../js/cambiarTema.js"></script>
<script src="../js/carrito.js"></script>

</body>
</html>
